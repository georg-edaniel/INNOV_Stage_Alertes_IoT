<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — IoT Alert System</title>
  <link rel="stylesheet" href="/static/app.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg-alt, #f0f4f8); }
    .login-card {
      background: var(--card-bg, #fff);
      border: 1px solid var(--border, #dde1e7);
      border-radius: 12px;
      padding: 2.5rem;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 8px 32px rgba(0,0,0,.08);
    }
    .login-logo {
      display: flex; align-items: center; justify-content: center;
      background: #fff; border-radius: 8px; padding: .5rem 1rem;
      margin-bottom: 1.2rem; border: 1px solid var(--border, #dde1e7);
    }
    .login-logo img { height: 32px; object-fit: contain; }
    h2 { font-size: 1.2rem; font-weight: 700; margin-bottom: .3rem; color: var(--text); }
    .login-subtitle { font-size: .83rem; color: var(--muted); margin-bottom: 1.6rem; }
    label { display: block; font-size: .82rem; font-weight: 600; margin-bottom: .3rem; color: var(--text); }
    input[type="text"], input[type="password"] {
      width: 100%; padding: .55rem .75rem;
      border: 1px solid var(--border, #dde1e7);
      border-radius: 6px; font-size: .9rem;
      background: var(--bg, #fff); color: var(--text);
      margin-bottom: 1rem; outline: none;
      transition: border-color .2s;
    }
    input:focus { border-color: var(--primary, #1a5c9c); }
    .btn-login {
      width: 100%; padding: .65rem; background: var(--primary, #1a5c9c);
      color: #fff; border: none; border-radius: 6px; font-size: .95rem;
      font-weight: 600; cursor: pointer; transition: background .2s;
    }
    .btn-login:hover { background: #1650a0; }
    .error-msg {
      background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c;
      border-radius: 6px; padding: .6rem .9rem; margin-bottom: 1rem;
      font-size: .85rem;
    }
    .hint { font-size: .75rem; color: var(--muted); text-align: center; margin-top: 1rem; }
  </style>
</head>
<body>
<div class="login-card">
  <div class="login-logo">
    <img src="/static/innov_logo.png" alt="INNOV" onerror="this.style.display='none'">
  </div>
  <h2>IoT Alert System</h2>
  <div class="login-subtitle">Connectez-vous pour accéder au tableau de bord</div>

  {% if error %}
  <div class="error-msg">{{ error }}</div>
  {% endif %}

  <form method="post" action="/login">
    <label for="username">Nom d'utilisateur</label>
    <input type="text" id="username" name="username" autocomplete="username" required autofocus>

    <label for="password">Mot de passe</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>

    <button type="submit" class="btn-login">Se connecter</button>
  </form>
  <div class="hint">INNOV / CCNB — Système d'alertes IoT 2026</div>
</div>
</body>
</html>
