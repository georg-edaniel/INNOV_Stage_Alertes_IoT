version: "3.9"

services:
  web:
    build: .
    ports:
      - "8084:8084"
    volumes:
      # Persistance de la base de données SQLite et des modèles ML
      - ./alerts.db:/app/alerts.db
      - ./if_model.pkl:/app/if_model.pkl
      # Persistance des fichiers de configuration
      - ./email_config.json:/app/email_config.json
      - ./telegram_config.json:/app/telegram_config.json
      - ./mqtt_config.json:/app/mqtt_config.json
      - ./webhook_config.json:/app/webhook_config.json
      - ./auth_config.json:/app/auth_config.json
      - ./thresholds_override.json:/app/thresholds_override.json
      - ./escalation_config.json:/app/escalation_config.json
      - ./sensors_config.json:/app/sensors_config.json
      # Sauvegardes automatiques
      - ./backups:/app/backups
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=sqlite:///./alerts.db
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8084/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Service PostgreSQL (optionnel — remplacer SQLite en production)
  # Décommenter pour activer PostgreSQL :
  # postgres:
  #   image: postgres:16-alpine
  #   ports:
  #     - "5432:5432"
  #   environment:
  #     POSTGRES_DB: iotdb
  #     POSTGRES_USER: iot
  #     POSTGRES_PASSWORD: iotpassword
  #   volumes:
  #     - pg_data:/var/lib/postgresql/data
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U iot -d iotdb"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

volumes:
  redis_data:
